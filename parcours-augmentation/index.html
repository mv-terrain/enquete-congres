<body>
<style>
/* Layout: application à une colonne (max 720 px), barre d'onglets fixe en bas, en-tête collant ; vert de bloc opératoire comme accent. */
:root{
  --bg:#f3f5f5; --surface:#ffffff; --line:#d9dfdf; --fg:#17201f; --muted:#56615f;
  --accent:#0d6b62; --accent-soft:#e1efec; --accent-ink:#ffffff;
  --urgent:#c4352d; --urgent-soft:#fbe9e7; --warn:#a86a00; --warn-soft:#fbf1dc; --ok:#2d7a43; --ok-soft:#e5f2e8;
  --font-display:Georgia,"Times New Roman",serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --cds-chart-axis:#a9b0ae; --cds-chart-grid:#d6dbda; --cds-chart-reference-tint:#e9ecec;
  --cds-chart-categorical-1:#2f6fd6; --cds-chart-categorical-2:#dd6a35; --cds-chart-categorical-3:#1f9a72;
  --cds-chart-categorical-4:#1f3a68; --cds-chart-categorical-5:#d1457f;
  --cds-chart-status-critical:#cf3a33; --cds-chart-status-warning:#e0a000;
  --cds-text-primary:#17201f; --cds-text-secondary:#56615f;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#18201f; --line:#2c3735; --fg:#e8eeec; --muted:#a3afac;
  --accent:#4cb8a8; --accent-soft:#16312d; --accent-ink:#06201c;
  --urgent:#ff7b72; --urgent-soft:#3a1716; --warn:#f0b54a; --warn-soft:#33270f; --ok:#6fcf8a; --ok-soft:#16301e;
  --cds-chart-axis:#6f7b78; --cds-chart-grid:#38433f; --cds-chart-reference-tint:#26302e;
  --cds-chart-categorical-1:#6ea2ff; --cds-chart-categorical-2:#f08a58; --cds-chart-categorical-3:#4fc79c;
  --cds-chart-categorical-4:#9db4e0; --cds-chart-categorical-5:#ef7aac;
  --cds-chart-status-critical:#ff7b72; --cds-chart-status-warning:#f0b54a;
  --cds-text-primary:#e8eeec; --cds-text-secondary:#a3afac; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#18201f; --line:#2c3735; --fg:#e8eeec; --muted:#a3afac;
  --accent:#4cb8a8; --accent-soft:#16312d; --accent-ink:#06201c;
  --urgent:#ff7b72; --urgent-soft:#3a1716; --warn:#f0b54a; --warn-soft:#33270f; --ok:#6fcf8a; --ok-soft:#16301e;
  --cds-chart-axis:#6f7b78; --cds-chart-grid:#38433f; --cds-chart-reference-tint:#26302e;
  --cds-chart-categorical-1:#6ea2ff; --cds-chart-categorical-2:#f08a58; --cds-chart-categorical-3:#4fc79c;
  --cds-chart-categorical-4:#9db4e0; --cds-chart-categorical-5:#ef7aac;
  --cds-chart-status-critical:#ff7b72; --cds-chart-status-warning:#f0b54a;
  --cds-text-primary:#e8eeec; --cds-text-secondary:#a3afac; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:52px}
.back{border:0;background:none;color:var(--accent);font-size:16px;padding:8px 8px 8px 0;cursor:pointer;display:flex;align-items:center;gap:2px;flex:none}
.back[hidden]{display:none!important}
.topbar h1{font-family:var(--font-display);font-weight:normal;font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proto{flex:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:2px 6px}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(88px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--font-display);font-weight:normal;font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
p{margin:0}
.lede{color:var(--muted);font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
ul.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.callout{border-radius:10px;padding:12px 14px;font-size:15px}
.callout.info{background:var(--accent-soft)}
.callout.warn{background:var(--warn-soft)}
.callout.urgent{background:var(--urgent-soft)}
.callout strong{display:block;margin-bottom:2px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fig-scroll svg{display:block;width:100%;min-width:640px;height:auto;font-family:var(--font-body)}
.fig figcaption{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
.fig .swipe{flex:none}
@media (min-width:700px){.fig .swipe{display:none}}
.journey{display:flex;flex-direction:column;gap:0;list-style:none;margin:0;padding:0}
.journey li{position:relative;padding-left:44px}
.journey li::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:2px;background:var(--line)}
.journey li:first-child::before{top:22px}
.journey li:last-child::before{bottom:auto;height:22px}
.jbtn{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0;cursor:pointer}
.jbtn:hover{border-color:var(--accent)}
.jnum{position:absolute;left:0;top:14px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.journey li.alert .jnum{background:var(--urgent)}
.jt{font-weight:600;font-size:16px}
.js{color:var(--muted);font-size:14px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.results{display:flex;flex-direction:column;gap:6px}
.res{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.res small{display:block;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent)}
.clist{display:flex;flex-direction:column;gap:8px}
.citem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.citem .ct{flex:1;min-width:0}
.citem .ct b{display:block;font-size:16px}
.citem .ct span{color:var(--muted);font-size:14px}
.pill{flex:none;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 8px}
.pill.urgent{background:var(--urgent-soft);color:var(--urgent)}
.pill.rapide{background:var(--warn-soft);color:var(--warn)}
.pill.prog{background:var(--ok-soft);color:var(--ok)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.check{display:flex;flex-direction:column;gap:2px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check label:last-child{border-bottom:0}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chead .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:14px}
.nextprev{display:flex;gap:10px}
.nextprev button{flex:1;min-width:0;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.nextprev small{display:block;color:var(--muted);font-size:12px}
.nextprev .nx{text-align:right}
.gallery{display:grid;grid-template-columns:1fr;gap:16px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.foot{font-size:13px;color:var(--muted)}
.refs li{font-size:14px}
.fig{cursor:zoom-in}
.figbtn{flex:none;border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px}
.figbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Visionneuse plein écran */
.viewer{position:fixed;inset:0;z-index:30;background:var(--surface);display:flex;flex-direction:column}
.viewer-bar{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.viewer-bar b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbtn{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;min-width:40px;height:36px;padding:0 10px;font-size:15px;cursor:pointer;flex:none}
.vbtn.close{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.viewer-hint{font-size:13px;color:var(--muted);text-align:center;padding:8px 16px 0}
.viewer-body{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;padding-top:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.viewer-body svg{display:block;margin:auto;height:auto;flex:none;font-family:var(--font-body)}
@media (orientation:landscape){.viewer-hint{display:none}}
body.noscroll{overflow:hidden}
/* Tablette et écran large : deux colonnes, texte à gauche, schémas à droite */
.figref{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--accent-soft);border:0;border-radius:10px;padding:10px 12px;font-size:14px;color:var(--fg);cursor:pointer}
.figref::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.figref span{flex:1;min-width:0}
.figref em{font-style:normal;color:var(--accent);font-weight:600;flex:none}
@media (min-width:1000px){
  .topbar-in,.tabbar-in{max-width:1240px}
  .wrap.split{max-width:1240px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:32px;align-items:start}
  .col-text{display:flex;flex-direction:column;gap:20px;min-width:0}
  .col-fig{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);max-height:calc(100vh - 68px - 92px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:16px;min-width:0;padding:2px 2px 8px;scroll-behavior:smooth}
  .col-fig > *{flex:none}
  .col-fig .fig-scroll svg{min-width:0}
  .col-fig .fig{transition:border-color .2s,box-shadow .2s}
  .col-fig .fig.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .col-fig .swipe{display:none}
  .wrap.wide{max-width:1240px}
  .wide .gallery{grid-template-columns:1fr 1fr}
  .wide .clist{display:grid;grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>

 ["ANSM — Surveillance de marché des implants mammaires (mise à jour 3 avril 2026)","https://ansm.sante.fr/dossiers-thematiques/surveillance-de-marche-des-implants-mammaires"],
 ["ANSM — Analyse des cas de LAGC-AIM depuis 2011 (novembre 2025)","https://ansm.sante.fr/uploads/2025/11/24/20251124-analyse-cas-lagc.pdf"],
 ["HAS — Information destinée aux femmes avant la pose de prothèses mammaires (2019)","https://www.has-sante.fr/jcms/p_3120264/fr/chirurgie-esthetique-information-destinee-aux-femmes-avant-la-pose-de-protheses-mammaires"],
 ["FDA — Risks and Complications of Breast Implants (2023)","https://www.fda.gov/medical-devices/breast-implants/risks-and-complications-breast-implants"],
 ["FDA — Squamous Cell Carcinoma in the Capsule Around Breast Implants (2023)","https://www.fda.gov/medical-devices/safety-communications/update-reports-squamous-cell-carcinoma-scc-capsule-around-breast-implants-fda-safety-communication"],
 ["Tebbetts JB, Adams WP — High Five Decision Support Process, Plast Reconstr Surg","https://altmetric.com/details/590936"],
 ["Tebbetts JB — Dual plane breast augmentation, Plast Reconstr Surg","https://pubmed.ncbi.nlm.nih.gov/17099485/"],
 ["Adams WP et al. — Steps to Minimize Bacterial Contamination, 42 000 implants, Plast Reconstr Surg 2017","https://pubmed.ncbi.nlm.nih.gov/28841597/"],
 ["Araco A et al. — 3 000 Primary Aesthetic Breast Augmentations, Aesthetic Plast Surg 2007","https://link.springer.com/article/10.1007/s00266-007-0162-8"],
 ["Stevens WG et al. — Ten-year Core Study Data, Plast Reconstr Surg 2018","https://pubmed.ncbi.nlm.nih.gov/29595714/"],
 ["Maxwell GP et al. — Ten-Year Results, Form-Stable Implant Core Study, Aesthet Surg J 2015","https://pmc.ncbi.nlm.nih.gov/articles/4399443"],
 ["Clemens MW et al. — Complete Surgical Excision in BIA-ALCL, J Clin Oncol 2016 (TNM MD Anderson)",""]];

/* ---------------- Rendu ---------------- */
const $view = document.getElementById('view');
const $title = document.getElementById('title');
const $back = document.getElementById('back');
const checks = {}; // état des cases, en mémoire seulement (aucune donnée patiente)

function stepById(id){ return STEPS.find(s=>s.id===id); }
function complById(id){ return COMPL.find(c=>c.id===id); }

function viewHome(){
  return `
  <section class="sec"><h2>De la première consultation au suivi</h2>
  <p class="lede">Aide-mémoire pour l'augmentation mammaire esthétique par implants : planification, technique, suites, complications et conduites à tenir.</p></section>
  <div class="search"><label for="q" class="sr" hidden>Rechercher</label><input id="q" type="search" placeholder="Rechercher : coque, pinch test, LAGC…" autocomplete="off"></div>
  <div class="results" id="results"></div>
  <ol class="journey">${STEPS.map((s,i)=>`<li class="${s.alert?'alert':''}"><span class="jnum">${s.alert?'!':i+1}</span>
    <button class="jbtn" data-go="${s.alert?'complications':'etape-'+s.id}"><span class="jt">${s.title}</span><span class="js">${s.sub}</span></button></li>`).join('')}</ol>
  ${call("warn","Prototype de démonstration","Support de formation non validé. Il ne remplace ni la notice du fabricant, ni les recommandations des sociétés savantes, ni le jugement du chirurgien. Aucune donnée patiente n'est saisie ni conservée.")}`;
}

function viewStep(s){
  const i = STEPS.indexOf(s);
  const prev = STEPS[i-1], next = STEPS[i+1];
  const target = x => x.alert ? 'complications' : 'etape-'+x.id;
  return `<section class="sec"><div class="meta">Étape ${i+1} sur ${STEPS.length-1}</div><h2>${s.title}</h2></section>${s.body()}
  <div class="nextprev">${prev?`<button data-go="${target(prev)}"><small>Précédent</small>${prev.title}</button>`:''}${next?`<button class="nx" data-go="${target(next)}"><small>Suivant</small>${next.title}</button>`:''}</div>`;
}

function complItem(c){
  return `<button class="citem" data-go="c-${c.id}"><span class="ct"><b>${c.t}</b><span>${c.s}</span></span><span class="pill ${c.u}">${PILL[c.u]}</span></button>`;
}
function viewCompl(){
  const groups = ["Précoce","Tardive","Rare"];
  const label = {"Précoce":"Complications précoces","Tardive":"Complications tardives","Rare":"Risques rares"};
  return `<section class="sec"><h2>Complications et conduites à tenir</h2>
  <p class="lede">Partir du symptôme ou de la complication. Le niveau indique le délai de prise en charge.</p></section>
  ${sec("Orientation par symptôme", `<div class="chips">${TRIAGE.map(([t,id])=>`<button class="chip" data-go="c-${id}">${t}</button>`).join('')}</div>`)}
  ${groups.map(g=>sec(label[g], `<div class="clist">${COMPL.filter(c=>c.g===g).map(complItem).join('')}</div>`)).join('')}`;
}
function viewComplDetail(c){
  const block = (t, items) => items && items.length ? sec(t, ul(items)) : '';
  return `<section class="sec"><div class="meta"><span class="pill ${c.u}">${PILL[c.u]}</span><span>${c.g === 'Rare' ? 'Risque rare' : 'Complication '+c.g.toLowerCase()}</span></div>
  <h2>${c.t}</h2><p class="lede">${c.s}</p></section>
  <div class="card"><h3 style="margin:0">Fréquence</h3><p>${c.inc}</p></div>
  ${block("Reconnaître", c.signes)}
  ${c.fig ? fig(c.fig) : ''}
  ${sec("Conduite à tenir", `<ol class="steps">${c.cat.map(x=>`<li>${x}</li>`).join('')}</ol>`)}
  ${c.note ? call(c.u==='urgent'?'urgent':'warn', "À retenir", c.note) : ''}
  ${block("Prévention", c.prev)}`;
}
function viewSchemas(){
  return `<section class="sec"><h2>Schémas</h2><p class="lede">Les 16 planches du guide. Sur iPhone, faire glisser chaque schéma horizontalement.</p></section>
  <div class="gallery">${Object.keys(FIG_CAPTION).map(fig).join('')}</div>`;
}
function viewRefs(){
  return `<section class="sec"><h2>Références</h2><p class="lede">Sources utilisées pour les contenus, consultées en octobre 2026.</p></section>
  <ul class="list refs">${REFS.map(([t,u])=>`<li>${u?`<a href="${u}" target="_blank" rel="noopener">${t}</a>`:t}</li>`).join('')}</ul>
  ${call("warn","Statut du document","Prototype de démonstration réalisé pour illustrer un parcours de soins. Les contenus doivent être relus par un chirurgien référent et validés par les affaires réglementaires avant toute diffusion. En l'état, l'application ne calcule rien pour une patiente donnée et n'enregistre aucune donnée.")}
  <p class="foot">Version 0.1 — octobre 2026.</p>`;
}

/* Recherche plein texte simple */
const INDEX = [
 ...STEPS.filter(s=>!s.alert).map(s=>({go:'etape-'+s.id, t:s.title, k:'Étape du parcours', txt:(s.title+' '+s.sub+' '+s.body()).replace(/<[^>]+>/g,' ')})),
 ...COMPL.map(c=>({go:'c-'+c.id, t:c.t, k:'Complication', txt:[c.t,c.s,c.inc,...c.signes,...c.cat,...c.prev,c.note||''].join(' ')}))
];
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
INDEX.forEach(e=>e.n = norm(e.txt));
function search(q){
  const words = norm(q).split(/\s+/).filter(w=>w.length>1);
  if(!words.length) return [];
  return INDEX.filter(e=>words.every(w=>e.n.includes(w))).slice(0,8);
}

function render(){
  const h = (location.hash||'').replace('#','') || 'accueil';
  let html, title = 'Parcours augmentation mammaire', tab = 'accueil', back = false;
  if(h.startsWith('etape-') && stepById(h.slice(6))){ const s = stepById(h.slice(6)); html = viewStep(s); title = s.title; back = true; }
  else if(h.startsWith('c-') && complById(h.slice(2))){ const c = complById(h.slice(2)); html = viewComplDetail(c); title = c.t; tab = 'complications'; back = true; }
  else if(h==='complications'){ html = viewCompl(); title = 'Complications'; tab = 'complications'; }
  else if(h==='schemas'){ html = viewSchemas(); title = 'Schémas'; tab = 'schemas'; }
  else if(h==='references'){ html = viewRefs(); title = 'Références'; tab = 'references'; }
  else { html = viewHome(); }
  $view.innerHTML = html;
  $view.classList.remove('view'); void $view.offsetWidth; $view.classList.add('view');
  $title.textContent = title;
  $back.hidden = !back;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current', b.dataset.go===tab ? 'page' : 'false'));
  restoreChecks();
  layout(h);
  window.scrollTo(0,0);
}

/* Mise en page deux colonnes sur grand écran */
const WIDE = window.matchMedia('(min-width:1000px)');
let figObserver = null;
function layout(h){
  if(figObserver){ figObserver.disconnect(); figObserver = null; }
  $view.classList.remove('split','wide');
  const isDetail = h.startsWith('etape-') || h.startsWith('c-');
  if(!WIDE.matches) return;
  if(h==='schemas' || h==='complications'){ $view.classList.add('wide'); return; }
  const figs = [...$view.querySelectorAll('.fig')];
  if(!isDetail || !figs.length) return;
  const colText = document.createElement('div'); colText.className = 'col-text';
  const colFig = document.createElement('aside'); colFig.className = 'col-fig'; colFig.setAttribute('aria-label','Schémas de la page');
  while($view.firstChild) colText.appendChild($view.firstChild);
  figs.forEach(f=>{
    const ref = document.createElement('button');
    ref.type = 'button'; ref.className = 'figref'; ref.dataset.ref = f.dataset.key;
    ref.innerHTML = `<span>Schéma : ${FIG_CAPTION[f.dataset.key]}</span><em>→</em>`;
    f.replaceWith(ref);
    colFig.appendChild(f);
  });
  $view.append(colText, colFig);
  $view.classList.add('split');
  const setActive = key => {
    colFig.querySelectorAll('.fig').forEach(f=>f.classList.toggle('active', f.dataset.key===key));
    const f = colFig.querySelector(`.fig[data-key="${key}"]`);
    if(f) colFig.scrollTo({top: f.offsetTop - 2});
  };
  setActive(figs[0].dataset.key);
  figObserver = new IntersectionObserver(entries=>{
    const vis = entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
    if(vis.length) setActive(vis[0].target.dataset.ref);
  }, {rootMargin:'-25% 0px -45% 0px'});
  colText.querySelectorAll('.figref').forEach(r=>figObserver.observe(r));
}
WIDE.addEventListener ? WIDE.addEventListener('change', render) : WIDE.addListener(render);

/* Visionneuse plein écran */
let viewer = null, zoom = 1, viewerKey = null;
function openViewer(key){
  closeViewer();
  viewerKey = key; zoom = 1;
  viewer = document.createElement('div');
  viewer.className = 'viewer'; viewer.setAttribute('role','dialog'); viewer.setAttribute('aria-modal','true');
  viewer.setAttribute('aria-label', FIG_CAPTION[key]);
  viewer.innerHTML = `<div class="viewer-bar"><b>${FIG_CAPTION[key]}</b>
    <button class="vbtn" type="button" data-zoom="-1" aria-label="Réduire">−</button>
    <button class="vbtn" type="button" data-zoom="1" aria-label="Agrandir">+</button>
    <button class="vbtn close" type="button" data-close aria-label="Fermer">Fermer</button></div>
    <p class="viewer-hint">Tournez l'iPhone à l'horizontale pour voir le schéma en entier.</p>
    <div class="viewer-body">${SVG[key]}</div>`;
  document.body.appendChild(viewer);
  document.body.classList.add('noscroll');
  sizeViewer();
  viewer.querySelector('[data-close]').focus();
}
function sizeViewer(){
  if(!viewer) return;
  const svg = viewer.querySelector('.viewer-body svg');
  const body = viewer.querySelector('.viewer-body');
  const vb = svg.viewBox.baseVal, ratio = vb.width / vb.height;
  const availW = body.clientWidth - 24, availH = body.clientHeight - 24;
  let fit = Math.min(availW, availH * ratio);
  const phonePortrait = window.innerWidth < 600;
  viewer.querySelector('.viewer-hint').hidden = !phonePortrait;
  if(phonePortrait) fit = Math.max(fit, 700);   // iPhone en portrait : lisible, défilement horizontal
  svg.style.width = Math.round(fit * zoom) + 'px';
  viewer.querySelector('[data-zoom="-1"]').disabled = zoom <= 1;
  viewer.querySelector('[data-zoom="1"]').disabled = zoom >= 3;
}
function closeViewer(){
  if(!viewer) return;
  viewer.remove(); viewer = null;
  document.body.classList.remove('noscroll');
}
window.addEventListener('resize', sizeViewer);
window.addEventListener('orientationchange', ()=>setTimeout(sizeViewer, 200));
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeViewer(); });
function navigate(id){ if(('#'+id)===location.hash) render(); else location.hash = id; }

function restoreChecks(){
  document.querySelectorAll('[data-check]').forEach(box=>{
    const id = box.dataset.check;
    box.querySelectorAll('input[type=checkbox]').forEach(inp=>{ inp.checked = !!(checks[id]&&checks[id][inp.id]); });
    updateCount(box);
  });
}
function updateCount(box){
  const all = box.querySelectorAll('input[type=checkbox]');
  const done = [...all].filter(i=>i.checked).length;
  box.querySelector('.count').textContent = `${done} / ${all.length}`;
}

document.addEventListener('click', e=>{
  if(viewer){
    if(e.target.closest('[data-close]')){ closeViewer(); return; }
    const z = e.target.closest('[data-zoom]');
    if(z){ zoom = Math.min(3, Math.max(1, zoom + (z.dataset.zoom==='1' ? 0.5 : -0.5))); sizeViewer(); }
    return;
  }
  const o = e.target.closest('[data-open]') || e.target.closest('.fig');
  if(o){ openViewer(o.dataset.open || o.dataset.key); return; }
  const fr = e.target.closest('.figref');
  if(fr){ openViewer(fr.dataset.ref); return; }
  const g = e.target.closest('[data-go]');
  if(g){ e.preventDefault(); navigate(g.dataset.go); return; }
  const l = e.target.closest('a[data-link]');
  if(l){ e.preventDefault(); navigate(l.getAttribute('href').slice(1)); return; }
  const r = e.target.closest('[data-reset]');
  if(r){ const box = r.closest('[data-check]'); checks[box.dataset.check] = {}; restoreChecks(); }
});
document.addEventListener('change', e=>{
  const box = e.target.closest('[data-check]');
  if(box && e.target.type==='checkbox'){
    const id = box.dataset.check; (checks[id] = checks[id]||{})[e.target.id] = e.target.checked; updateCount(box);
  }
});
document.addEventListener('input', e=>{
  if(e.target.id!=='q') return;
  const res = search(e.target.value);
  const box = document.getElementById('results');
  box.innerHTML = e.target.value.trim().length<2 ? '' : (res.length ? res.map(r=>`<button class="res" data-go="${r.go}">${r.t}<small>${r.k}</small></button>`).join('') : `<p class="foot">Aucun résultat. Essayer un autre terme : coque, rupture, sillon…</p>`);
});
$back.addEventListener('click', ()=>{ const h = (location.hash||'').slice(1); navigate(h.startsWith('c-') ? 'complications' : 'accueil'); });
window.addEventListener('hashchange', ()=>{ closeViewer(); render(); });
render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {}); });
}
</script>
</body>

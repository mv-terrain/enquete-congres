<style>
/* Layout: one-column mobile tool — sticky header, list or dashboard, full-screen tap-only form, bottom tab bar */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --sunk:#E8EAEF; --line:#D5D9E2;
  --fg:#161B26; --muted:#5B6476; --accent:#2B4C9B; --accent-fg:#FFFFFF; --accent-soft:#DCE4F7;
  --hot:#B5651D; --hot-soft:#F6E6D6; --ok:#2E7D4F; --ok-soft:#DCEFE3; --warn:#9A3B2E;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141B; --surface:#1A1F2A; --sunk:#232A38; --line:#323B4D;
  --fg:#E9ECF2; --muted:#9AA3B5; --accent:#8EA9F2; --accent-fg:#0F1626; --accent-soft:#25335A;
  --hot:#E3A060; --hot-soft:#3C2B1B; --ok:#6CC28F; --ok-soft:#1C3527; --warn:#E58A7B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141B; --surface:#1A1F2A; --sunk:#232A38; --line:#323B4D;
  --fg:#E9ECF2; --muted:#9AA3B5; --accent:#8EA9F2; --accent-fg:#0F1626; --accent-soft:#25335A;
  --hot:#E3A060; --hot-soft:#3C2B1B; --ok:#6CC28F; --ok-soft:#1C3527; --warn:#E58A7B; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.sync{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.sync.ok{background:var(--ok-soft);color:var(--ok)}
.sync.wait{background:var(--hot-soft);color:var(--hot)}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:14px;display:flex;flex-direction:column;gap:12px}

/* list view */
.search{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
select.dept{flex:none;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:var(--surface);color:var(--fg)}
.count{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer}
.row:first-child{border-top:0}
.row:active{background:var(--sunk)}
.row .who{flex:1;min-width:0}
.row .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who span{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;align-items:center;flex:none}
.pal{font-size:11px;font-weight:700;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.pal.A{background:var(--accent);color:var(--accent-fg)}
.pal.B{background:var(--accent-soft);color:var(--accent)}
.tag{font-size:11.5px;padding:3px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.unk{background:var(--hot-soft);color:var(--hot)}
.tag.done{background:var(--ok-soft);color:var(--ok);font-weight:600}
.newbtn{border:1px dashed var(--line);background:none;border-radius:var(--r);padding:12px;color:var(--accent);font-weight:600;cursor:pointer}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-block:8px}
.tab{border:0;background:none;padding:10px;border-radius:var(--r);font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}

/* form overlay */
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet-head .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.back{border:0;background:var(--sunk);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600}
.sheet-title{flex:1;min-width:0}
.sheet-title b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-title span{font-size:12px;color:var(--muted)}
.prog{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.sheet-body .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
.known{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.known b{color:var(--fg);font-weight:600}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.q h3{margin:0 0 8px;font-size:14px;font-weight:650;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.q h3 small{font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap}
.hint{font-size:12px;color:var(--hot);margin:-4px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{min-height:42px;padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:var(--bg);cursor:pointer;font-size:14.5px;position:relative;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.opt .rk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent-fg);color:var(--accent);font-size:11px;font-weight:700;margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:6px 12px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.pricerow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.pricerow label{font-size:13px;color:var(--muted)}
.num{width:110px;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.txt{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
textarea.txt{min-height:90px;resize:vertical}
.newgrid{display:grid;grid-template-columns:1fr;gap:8px}
.sheet-foot{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-foot .wrap{display:flex;gap:10px;padding-block:10px}
.save{flex:1;border:0;border-radius:var(--r);padding:14px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:16px;cursor:pointer}
.del{border:1px solid var(--line);background:none;border-radius:var(--r);padding:0 14px;color:var(--warn);cursor:pointer;font-size:13px}
.del.arm{background:var(--warn);color:var(--surface);border-color:var(--warn);font-weight:700}
.err{color:var(--warn);font-size:13px}

/* dashboard */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{margin:0;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card .sub{font-size:12.5px;color:var(--muted);margin:-4px 0 0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .trk{height:12px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.bar .fill.hot{background:var(--hot)}
.bar .val{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;min-width:4.5em;text-align:right}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
.hotrow{display:flex;flex-direction:column;gap:5px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.hotrow:first-of-type{border-top:0}
.hotrow .l1{display:flex;justify-content:space-between;gap:8px}
.hotrow .l1 b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heat{font-variant-numeric:tabular-nums;font-weight:700;color:var(--hot)}
.why{display:flex;flex-wrap:wrap;gap:5px}
.why .tag{background:var(--hot-soft);color:var(--hot)}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0}
.exp{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
html,body{margin:0}[hidden]{display:none!important}
.lock{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center}
.lock .wrap{width:100%;display:flex;flex-direction:column;gap:12px}
.lock h1{margin:0;font-size:22px;letter-spacing:-.01em}
.lock p{margin:0;color:var(--muted)}
.backup{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--hot-soft);color:var(--hot);border-radius:var(--r);padding:10px 12px;font-size:13px}
.backup.ok{background:var(--ok-soft);color:var(--ok)}

/* ---------- storage: everything stays on this iPhone ---------- */
const LS_F="sofcpre26.fiches", LS_S="sofcpre26.surg", LS_M="sofcpre26.meta";
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
let fiches = lsGet(LS_F,{});
let meta = lsGet(LS_M,{lastBackup:0});
const pending = {};               // no network sync in this version
function flush(){}
function persist(){ if(!lsSet(LS_F,fiches)) toast("Enregistrement impossible : exporte tes fiches maintenant"); setSync(); }
let offlineReady=false;
function setSync(){
  const el=document.getElementById("sync"); const n=Object.keys(fiches).length;
  el.className="sync"+(offlineReady?" ok":"");
  el.textContent=(offlineReady?"Prêt hors ligne · ":"")+n+" fiche"+(n>1?"s":"");
}
function unsaved(){return Object.values(fiches).filter(f=>(f.updatedAt||0)>(meta.lastBackup||0)).length}
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const isCible=s=>!s.b && (/sofcpre/i.test(s.soc) || s.p==="A" || s.p==="B");
function brandShort(b){return b.replace(/\s*\(.*?\)\s*/g,"").replace("GCA","GC Aesthetics")}
function ficheFor(sid){return fiches[sid]}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._);toast._=setTimeout(()=>t.hidden=true,1800)}
function prixTTC(f){
  if(f.prixExact>0) return f.prixExact*(f.prixBase==="HT"?1.2:1);
  const m=PRIXMID[f.prix]; return m? m*(f.prixBase==="HT"?1.2:1) : null;
}
function answered(f){return ANSWER_KEYS.filter(k=>{const v=f[k];return Array.isArray(v)?v.length:!!v}).length}

function renderList(){
  const q=norm($("#q").value.trim());
  const newOnes=Object.values(fiches).filter(f=>f.isNew).map(f=>({id:f.id,n:f.nom,v:f.ville,d:f.dept,p:"",b:"",soc:"",ph:0,isNew:1}));
  let arr=SURG.concat(newOnes);
  if(q.length) arr=arr.filter(s=>norm(s.n).includes(q)||norm(s.v).includes(q));
  else if(filt==="ins") arr=arr.filter(s=>s.ins);
  else if(filt==="cible") arr=arr.filter(isCible);
  else if(filt==="perth") arr=arr.filter(s=>s.ph);
  else if(filt==="done") arr=arr.filter(s=>fiches[s.id]);
  if(dept) arr=arr.filter(s=>(s.d||"").split(/\s*\/\s*/).includes(dept));
  const shown=arr.slice(0,120);
  $("#count").textContent = (q?"Recherche : ":"")+arr.length+" chirurgien"+(arr.length>1?"s":"")+(arr.length>shown.length?" · 120 premiers affichés":"");
  $("#list").innerHTML = shown.length? shown.map(s=>{
    const f=fiches[s.id];
    const right = f? `<span class="tag done">Saisi</span>` : (s.b? `<span class="tag">${esc(brandShort(s.b))}</span>` : `<span class="tag unk">marque ?</span>`);
    return `<button class="row" data-id="${esc(s.id)}"><div class="who"><b>${esc(s.n)}</b><span>${esc(s.v)}${s.d?" · "+esc(s.d):""}${s.ins?" · inscrit":""}${s.ph?" · ancien Perthèse":""}${s.isNew?" · ajouté au congrès":""}</span></div><div class="tags">${right}${s.p?`<span class="pal ${s.p}">${s.p}</span>`:""}</div></button>`}).join("")
    : `<div class="empty" style="padding:14px">Aucun chirurgien ne correspond. Utilise le bouton ci-dessous pour l'ajouter.</div>`;
}
$("#q").addEventListener("input",renderList);
$("#dept").addEventListener("change",e=>{dept=e.target.value;renderList()});
document.querySelectorAll(".fchip").forEach(b=>b.addEventListener("click",()=>{filt=b.dataset.f;document.querySelectorAll(".fchip").forEach(x=>x.setAttribute("aria-pressed",x===b));renderList()}));
$("#list").addEventListener("click",e=>{const r=e.target.closest(".row");if(r)openSheet(r.dataset.id)});
$("#newbtn").addEventListener("click",()=>openSheet(null));

/* ---------- form sheet ---------- */
let cur=null, delArmed=false;
function openSheet(id){
  const s = id? (BYID[id]||null) : null;
  const ex = id? fiches[id] : null;
  cur = ex? JSON.parse(JSON.stringify(ex)) : {id: id || ("n-"+Date.now().toString(36)), sid:id||"", isNew: !s, nom:s?s.n:"", ville:s?s.v:"", dept:s?s.d:"", createdAt:Date.now()};
  if(!cur.prixBase) cur.prixBase="TTC";
  delArmed=false; renderSheet(s, !!ex);
  const sh=$("#sheet"); sh.hidden=false; sh.scrollTop=0; document.body.style.overflow="hidden";
}
function closeSheet(){$("#sheet").hidden=true;document.body.style.overflow="";cur=null}
function optBtn(k,v,on,extra){return `<button class="opt" data-k="${k}" data-v="${esc(v)}" aria-pressed="${on}">${extra||""}${esc(v)}</button>`}
function renderSheet(s, exists){
  const f=cur;
  const known = s? [
    `<span><b>${esc(s.v)} · ${esc(s.d)}</b>${s.p?` · palier ${s.p} · score ${s.s}`:""}</span>`,
    s.b? `<span>Marque connue : <b>${esc(s.b)}</b> — à reconfirmer</span>` : `<span>Marque d'implant : <b>inconnue</b></span>`,
    s.t? `<span>${esc(s.t)}</span>`:"",
  ].join("") : "";
  const qs = Q.map(q=>{
    let hint="";
    if(s&&q.k==="m1"&&s.b) hint=`<div class="hint">Fichier : ${esc(s.b)}</div>`;
    if(s&&q.k==="perth"&&s.ph) hint=`<div class="hint">Cité comme ancien poseur dans tes reportings 2024</div>`;
    let body="";
    if(q.type==="one") body=q.o.map(v=>optBtn(q.k,v,f[q.k]===v)).join("");
    else if(q.type==="multi") body=q.o.map(v=>optBtn(q.k,v,(f[q.k]||[]).includes(v))).join("");
    else if(q.type==="rank") body=q.o.map(v=>{const i=(f[q.k]||[]).indexOf(v);return optBtn(q.k,v,i>=0,i>=0?`<span class="rk">${i+1}</span>`:"")}).join("");
    else if(q.type==="price") body=q.o.map(v=>optBtn(q.k,v,f.prix===v)).join("")+
      `<div class="pricerow"><div class="seg" role="group" aria-label="Base du prix"><button data-base="TTC" aria-pressed="${f.prixBase!=="HT"}">TTC</button><button data-base="HT" aria-pressed="${f.prixBase==="HT"}">HT</button></div>
       <label for="px">Prix exact €</label><input id="px" class="num" inputmode="decimal" placeholder="optionnel" value="${f.prixExact||""}"></div>`;
    return `<div class="q"><h3>${esc(q.t)}${q.opt?`<small>${esc(q.opt)}</small>`:""}</h3>${hint}<div class="opts">${body}</div></div>`;
  }).join("");
  const newForm = f.isNew? `<div class="q"><h3>Nouveau chirurgien</h3><div class="newgrid">
      <input id="nn" class="txt" placeholder="Nom (ex. Dr Jean Dupont)" value="${esc(f.nom)}" autocapitalize="words">
      <input id="nv" class="txt" placeholder="Ville" value="${esc(f.ville)}" autocapitalize="words">
      <select id="nd" class="txt">${DEPTS.map(d=>`<option value="${d[0]}" ${f.dept===d[0]?"selected":""}>${d[0]} ${esc(d[1])}</option>`).join("")}</select>
      <div id="nerr" class="err" hidden>Indique au moins le nom.</div></div></div>` : "";
  $("#sheet").innerHTML = `
    <div class="sheet-head"><div class="wrap"><button class="back" id="back">← Liste</button>
      <div class="sheet-title"><b>${esc(f.nom||"Nouveau chirurgien")}</b><span>${exists?"Fiche déjà saisie · modifiable":"Nouvelle fiche"}</span></div>
      <div class="prog" id="prog">${answered(f)}/${Q.length}</div></div></div>
    <div class="sheet-body"><div class="wrap">
      ${s?`<div class="known">${known}</div>`:""}
      ${newForm}${qs}
      <div class="q"><h3>Note libre<small>dictée possible</small></h3><textarea id="note" class="txt" placeholder="Ce qu'il attend, prix précis, nom de sa clinique…">${esc(f.note||"")}</textarea></div>
    </div></div>
    <div class="sheet-foot"><div class="wrap">${exists?`<button class="del" id="del">Effacer</button>`:""}<button class="save" id="save">Enregistrer la fiche</button></div></div>`;
}
$("#sheet").addEventListener("click",e=>{
  if(!cur)return;
  if(e.target.closest("#back")){closeSheet();return}
  if(e.target.closest("#save")){saveCur();return}
  const del=e.target.closest("#del");
  if(del){ if(!delArmed){delArmed=true;del.classList.add("arm");del.textContent="Confirmer";return}
    const id=cur.id; delete fiches[id]; pending[id]="del"; persist(); closeSheet(); renderAll(); flush(); toast("Fiche effacée"); return;}
  const base=e.target.closest("[data-base]");
  if(base){cur.prixBase=base.dataset.base;base.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===base));return}
  const b=e.target.closest(".opt"); if(!b)return;
  const k=b.dataset.k, v=b.dataset.v, q=Q.find(x=>x.k===k);
  if(q.type==="one"||q.type==="price"){ cur[k] = cur[k]===v? "" : v; b.parentNode.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",cur[k]===x.dataset.v)); }
  else if(q.type==="multi"){ let a=cur[k]||[];
    if(a.includes(v)) a=a.filter(x=>x!==v); else { a = q.excl? (v===q.excl?[v]:a.filter(x=>x!==q.excl).concat(v)) : a.concat(v); }
    cur[k]=a; b.parentNode.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",a.includes(x.dataset.v))); }
  else if(q.type==="rank"){ let a=cur[k]||[];
    if(a.includes(v)) a=a.filter(x=>x!==v); else if(a.length<q.max) a=a.concat(v); else {toast("3 critères maximum");return}
    cur[k]=a; b.parentNode.querySelectorAll(".opt").forEach(x=>{const i=a.indexOf(x.dataset.v);x.setAttribute("aria-pressed",i>=0);x.innerHTML=(i>=0?`<span class="rk">${i+1}</span>`:"")+esc(x.dataset.v)}); }
  $("#prog").textContent=answered(cur)+"/"+Q.length;
});
function saveCur(){
  const f=cur;
  if(f.isNew){ f.nom=($("#nn").value||"").trim(); f.ville=($("#nv").value||"").trim(); f.dept=$("#nd").value;
    if(!f.nom){$("#nerr").hidden=false;$("#nn").focus();return} }
  const px=parseFloat(String($("#px")?.value||"").replace(",","."));
  f.prixExact = px>0? Math.round(px) : 0;
  f.note=($("#note").value||"").trim();
  f.prixTTC = prixTTC(f);
  f.updatedAt=Date.now();
  fiches[f.id]=f; pending[f.id]="set"; persist();
  closeSheet(); renderAll(); flush(); toast("Fiche enregistrée");
}

/* ---------- dashboard ---------- */
const pct=(a,b)=>b?Math.round(100*a/b):0;
function bars(rows,opts={}){ // rows: [label, value, display]
  const max=Math.max(1,...rows.map(r=>r[1]));
  return `<div class="bars">${rows.map(r=>`<div class="bar"><span class="lab">${esc(r[0])}</span><span class="trk"><span class="fill${opts.hot?" hot":""}" style="width:${Math.max(r[1]>0?3:0,100*r[1]/max)}%;display:block"></span></span><span class="val">${r[2]}</span></div>`).join("")}</div>`;
}
let shareMode="n";
function heat(f){
  if(f.ouv==="Non")return {h:-1,why:[]};
  let h=0,why=[];
  if(f.ouv==="Oui"){h+=3;why.push("Ouvert")} else if(f.ouv==="Peut-être"){h+=1.5;why.push("Peut-être")}
  const v=VOLMID[f.vol]; if(v){h+=Math.min(v,25)/5; if(v>=7.5)why.push(f.vol+" aug./mois")}
  if(f.sat&&+f.sat<=2){h+=2;why.push("Peu satisfait ("+f.sat+"/5)")} else if(f.sat==="3"){h+=1;why.push("Satisfaction 3/5")}
  if(f.perth==="Oui"){h+=1;why.push("Ancien Perthèse")}
  if((f.type||[]).includes("Ronds microtexturés")){h+=1;why.push("Ronds microtexturés")}
  if(f.combo==="Oui"){h+=1;why.push("Offre combinée")}
  if((f.suite||[]).includes("Invitation avant-première"))why.push("À inviter");
  return {h,why};
}
function renderDash(){
  const F=Object.values(fiches);
  const n=F.length;
  const el=$("#dash");
  if(!n){ el.innerHTML=`<div class="card"><h2>Tableau de bord</h2><p class="empty">Aucune fiche pour l'instant. Ouvre un chirurgien dans l'onglet « Chirurgiens » et coche ses réponses : parts de marque, prix TTC, kits, critères et liste des chirurgiens chauds se calculent ici au fil du congrès.</p></div>${exportCard(0)}`; bindDash(); return; }
  const newBrand=F.filter(f=>f.m1 && (f.isNew || !(BYID[f.sid]||{}).b)).length;
  const volTot=F.reduce((a,f)=>a+(VOLMID[f.vol]||0),0);
  const open=F.filter(f=>f.ouv==="Oui"||f.ouv==="Peut-être").length;
  const withOuv=F.filter(f=>f.ouv).length;
  // brand shares
  const bmap={}; F.forEach(f=>{if(!f.m1)return; const b=bmap[f.m1]||(bmap[f.m1]={n:0,vol:0,sec:0,prix:[],sat:[],ouv:0,ouvN:0,kit:{},kitN:0}); b.n++; b.vol+=VOLMID[f.vol]||0;
    const p=f.prixTTC??prixTTC(f); if(p)b.prix.push(p); if(f.sat)b.sat.push(+f.sat); if(f.ouv){b.ouvN++; if(f.ouv!=="Non")b.ouv++}
    if(f.kit&&f.kit.length){b.kitN++; f.kit.forEach(k=>b.kit[k]=(b.kit[k]||0)+1)} });
  F.forEach(f=>{if(f.m2&&f.m2!==f.m1){(bmap[f.m2]||(bmap[f.m2]={n:0,vol:0,sec:0,prix:[],sat:[],ouv:0,ouvN:0,kit:{},kitN:0})).sec++}});
  const brands=Object.entries(bmap).sort((a,b)=>(shareMode==="n"?b[1].n-a[1].n:b[1].vol-a[1].vol)||b[1].sec-a[1].sec);
  const totN=brands.reduce((a,b)=>a+b[1].n,0), totV=brands.reduce((a,b)=>a+b[1].vol,0);
  const shareRows=brands.map(([k,b])=>shareMode==="n"?[k,b.n,`${b.n} · ${pct(b.n,totN)} %`]:[k,b.vol,`${pct(b.vol,totV)} %`]);
  const secLine=brands.filter(b=>b[1].sec).map(b=>`${esc(b[0])} ${b[1].sec}`).join(" · ");
  // price
  const priceRows=brands.filter(b=>b[1].prix.length).map(([k,b])=>{const a=b.prix;const avg=a.reduce((x,y)=>x+y,0)/a.length;return `<tr><td>${esc(k)}</td><td>${a.length}</td><td><b>${Math.round(avg)} €</b></td><td>${Math.round(Math.min(...a))}–${Math.round(Math.max(...a))} €</td></tr>`}).join("");
  // kit
  const kitTbl=brands.filter(b=>b[1].kitN).map(([k,b])=>`<tr><td>${esc(k)}</td>${KIT.map(x=>`<td>${b.kit[x]?pct(b.kit[x],b.kitN)+" %":"–"}</td>`).join("")}<td>${b.kitN}</td></tr>`).join("");
  // criteria
  const cs={},cc={}; F.forEach(f=>(f.crit||[]).forEach((c,i)=>{cs[c]=(cs[c]||0)+(3-i);cc[c]=(cc[c]||0)+1}));
  const critRows=Object.entries(cs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,v,`${v} pts · ${cc[k]}×`]);
  // types
  const ty={}; F.forEach(f=>(f.type||[]).forEach(t=>ty[t]=(ty[t]||0)+1)); const tyN=F.filter(f=>(f.type||[]).length).length;
  const tyRows=TYPES.filter(t=>ty[t]).map(t=>[t,ty[t],`${ty[t]} · ${pct(ty[t],tyN)} %`]);
  // sat & openness by brand
  const satRows=brands.filter(b=>b[1].sat.length||b[1].ouvN).map(([k,b])=>`<tr><td>${esc(k)}</td><td>${b.sat.length?(b.sat.reduce((x,y)=>x+y,0)/b.sat.length).toFixed(1).replace(".",","):"–"}</td><td>${b.ouvN?pct(b.ouv,b.ouvN)+" %":"–"}</td><td>${Math.max(b.sat.length,b.ouvN)}</td></tr>`).join("");
  // combo
  const co={}; F.forEach(f=>{if(f.combo)co[f.combo]=(co[f.combo]||0)+1}); const coN=Object.values(co).reduce((a,b)=>a+b,0);
  const coRows=["Oui","Déjà client","Non"].filter(k=>co[k]).map(k=>[k,co[k],`${co[k]} · ${pct(co[k],coN)} %`]);
  // hot
  const hot=F.map(f=>({f,...heat(f)})).filter(x=>x.h>=3).sort((a,b)=>b.h-a.h).slice(0,15);
  // dept
  const dm={}; F.forEach(f=>{const d=(f.dept||"?").split(/\s*\/\s*/)[0]; const o=dm[d]||(dm[d]={n:0,b:{}}); o.n++; if(f.m1)o.b[f.m1]=(o.b[f.m1]||0)+1});
  const deptRows=Object.entries(dm).sort((a,b)=>b[1].n-a[1].n).map(([d,o])=>{const top=Object.entries(o.b).sort((a,b)=>b[1]-a[1])[0];return `<tr><td>${esc(d)}</td><td>${o.n}</td><td>${top?esc(top[0])+" ("+top[1]+")":"–"}</td></tr>`}).join("");
  const suiteN=F.filter(f=>(f.suite||[]).includes("Invitation avant-première")).length, rdvN=F.filter(f=>(f.suite||[]).includes("RDV")).length;

  el.innerHTML=`
  <div class="kpis">
    <div class="kpi"><b>${n}</b><span>fiches saisies</span></div>
    <div class="kpi"><b>${newBrand}</b><span>marques découvertes</span></div>
    <div class="kpi"><b>${Math.round(volTot)}</b><span>augmentations / mois déclarées</span></div>
    <div class="kpi"><b>${open}<small style="font-size:14px;color:var(--muted)">/${withOuv}</small></b><span>ouverts à une autre marque</span></div>
  </div>
  <div class="card"><h2>Parts de marque<span class="seg" role="group" aria-label="Mesure"><button data-share="n" aria-pressed="${shareMode==="n"}">Chirurgiens</button><button data-share="vol" aria-pressed="${shareMode==="vol"}">Volume</button></span></h2>
    <p class="sub">${shareMode==="n"?"Marque principale, en nombre de chirurgiens.":"Pondéré par les augmentations déclarées par mois."}</p>
    ${shareRows.length?bars(shareRows):'<p class="empty">Pas encore de marque principale saisie.</p>'}
    ${secLine?`<p class="note">Aussi citées en secondaire : ${secLine}</p>`:""}</div>
  <div class="card"><h2>Prix TTC de la paire</h2><p class="sub">Prix exact s'il est saisi, sinon milieu de tranche. Les prix donnés en HT sont convertis (×1,2).</p>
    ${priceRows?`<div class="tblw"><table><thead><tr><th>Marque</th><th>n</th><th>Moyenne</th><th>Fourchette</th></tr></thead><tbody>${priceRows}</tbody></table></div>`:'<p class="empty">Aucun prix saisi.</p>'}</div>
  <div class="card"><h2>Ce que les marques fournissent</h2><p class="sub">Part des chirurgiens de chaque marque qui citent le service.</p>
    ${kitTbl?`<div class="tblw"><table><thead><tr><th>Marque</th>${["Sizers","Funnel","Garantie","Dépôt","Form."].map(k=>`<th>${k}</th>`).join("")}<th>n</th></tr></thead><tbody>${kitTbl}</tbody></table></div>`:'<p class="empty">Rien de saisi.</p>'}</div>
  <div class="card"><h2>Ce qui fait choisir une marque</h2><p class="sub">1er critère = 3 pts, 2e = 2 pts, 3e = 1 pt.</p>
    ${critRows.length?bars(critRows):'<p class="empty">Aucun critère saisi.</p>'}</div>
  <div class="card"><h2>Types posés</h2><p class="sub">Estyme Matrix au lancement : ronds microtexturés.</p>
    ${tyRows.length?bars(tyRows):'<p class="empty">Aucun type saisi.</p>'}</div>
  <div class="card"><h2>Satisfaction et ouverture par marque</h2>
    ${satRows?`<div class="tblw"><table><thead><tr><th>Marque actuelle</th><th>Satisf. /5</th><th>Ouverts</th><th>n</th></tr></thead><tbody>${satRows}</tbody></table></div>`:'<p class="empty">Rien de saisi.</p>'}</div>
  <div class="card"><h2>Offre combinée AH Estyme / Nuceiva</h2>${coRows.length?bars(coRows):'<p class="empty">Rien de saisi.</p>'}</div>
  <div class="card"><h2>Chirurgiens chauds<span class="note">${rdvN} RDV · ${suiteN} à inviter</span></h2><p class="sub">Ouverts au changement, gros volume, peu satisfaits, anciens Perthèse, ronds microtexturés.</p>
    ${hot.length?`<div>${hot.map(x=>`<button class="hotrow" data-id="${esc(x.f.id)}"><span class="l1"><b>${esc(x.f.nom)}</b><span class="heat">${x.h.toFixed(1).replace(".",",")}</span></span><span class="note">${esc(x.f.ville||"")} · ${esc(x.f.dept||"")}${x.f.m1?" · "+esc(x.f.m1):""}</span><span class="why">${x.why.map(w=>`<span class="tag">${esc(w)}</span>`).join("")}</span></button>`).join("")}</div>`:'<p class="empty">Personne au-dessus du seuil pour l\'instant.</p>'}</div>
  <div class="card"><h2>Par département</h2><div class="tblw"><table><thead><tr><th>Dépt</th><th>Fiches</th><th>Marque dominante</th></tr></thead><tbody>${deptRows}</tbody></table></div></div>
  ${exportCard(n)}`;
  bindDash();
}
function exportCard(n){const u=unsaved();const last=meta.lastBackup?new Date(meta.lastBackup).toLocaleString("fr-FR",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"jamais";
  return `<div class="card"><h2>Sauvegarder et exporter</h2>
  <div class="backup ${u?"":"ok"}"><span>${u?`${u} fiche${u>1?"s":""} pas encore sauvegardée${u>1?"s":""}`:"Tout est sauvegardé"}</span><span>Dernière : ${esc(last)}</span></div>
  <p class="sub" style="margin:0">Les fiches sont gardées dans cet iPhone. Chaque soir, envoie la sauvegarde par Mail ou dans Fichiers : c'est elle que tu me donneras pour mettre à jour ton fichier des 260 chirurgiens.</p>
  <div class="exp"><button class="btn pri" id="bak" ${n?"":"disabled"}>Envoyer la sauvegarde</button><button class="btn" id="csv" ${n?"":"disabled"}>Tableau Excel (CSV)</button><button class="btn" id="copy" ${n?"":"disabled"}>Copier le tableau</button></div>
  <div class="exp"><label class="btn" for="restore">Restaurer une sauvegarde</label><input id="restore" type="file" accept=".json,application/json" hidden></div></div>`}
function bindDash(){
  document.querySelectorAll("[data-share]").forEach(b=>b.addEventListener("click",()=>{shareMode=b.dataset.share;renderDash()}));
  document.querySelectorAll(".hotrow").forEach(b=>b.addEventListener("click",()=>openSheet(b.dataset.id)));
  $("#csv")?.addEventListener("click",downloadCsv);
  $("#copy")?.addEventListener("click",copyCsv);
  $("#bak")?.addEventListener("click",backup);
  $("#restore")?.addEventListener("change",restore);
}
function csv(){
  const cols=["Chirurgien","Ville","Dépt","Palier","RPPS","Nouveau","Aug./mois","Marque principale","Marque secondaire","Types","Prix tranche","Base","Prix exact","Prix TTC estimé","Fourni","Critère 1","Critère 2","Critère 3","Satisfaction","Ouvert","Ancien Perthèse","Offre combinée","Suite","Note","Mis à jour"];
  const q=v=>{v=String(v??"");return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=Object.values(fiches).sort((a,b)=>(a.nom||"").localeCompare(b.nom||"","fr")).map(f=>{const s=BYID[f.sid]||{};const c=f.crit||[];const p=f.prixTTC??prixTTC(f);
    return [f.nom,f.ville,f.dept,s.p||"",(s.id||"").startsWith("r")?s.id.slice(1):"",f.isNew?"Oui":"",f.vol,f.m1,f.m2,(f.type||[]).join(", "),f.prix,f.prixBase,f.prixExact||"",p?Math.round(p):"",(f.kit||[]).join(", "),c[0],c[1],c[2],f.sat,f.ouv,f.perth,f.combo,(f.suite||[]).join(", "),f.note,new Date(f.updatedAt).toLocaleString("fr-FR")].map(q).join(";")});
  return "﻿"+[cols.join(";")].concat(rows).join("\r\n");
}
async function shareFile(name,text,mime){
  const file=new File([text],name,{type:mime});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});return true}
    catch(e){ if(e&&e.name==="AbortError") return false; }
  }
  try{const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true}
  catch(e){toast("Export impossible : utilise « Copier le tableau »");return false}
}
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[-:T]/g,"").replace(/^(\d{8})(\d{4})$/,"$1-$2");
async function downloadCsv(){ await shareFile("Enquete_SOFCPRE_"+stamp()+".csv",csv(),"text/csv"); }
async function backup(){
  const body=JSON.stringify({app:"enquete-sofcpre",v:1,exportedAt:new Date().toISOString(),fiches},null,1);
  if(await shareFile("Sauvegarde_enquete_SOFCPRE_"+stamp()+".json",body,"application/json")){meta.lastBackup=Date.now();lsSet(LS_M,meta);renderDash();toast("Sauvegarde envoyée")}
}
async function restore(e){
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  try{const j=JSON.parse(await f.text()); if(!j||!j.fiches)throw 0; let n=0;
    Object.values(j.fiches).forEach(x=>{if(x&&x.id&&(!fiches[x.id]||(x.updatedAt||0)>(fiches[x.id].updatedAt||0))){fiches[x.id]=x;n++}});
    persist(); renderAll(); setSync(); toast(n+" fiche"+(n>1?"s":"")+" restaurée"+(n>1?"s":""));
  }catch(err){toast("Ce fichier n'est pas une sauvegarde de l'enquête")}
}
async function copyCsv(){
  const t=csv().replace(/^﻿/,"").replace(/;/g,"\t");
  try{await navigator.clipboard.writeText(t);toast("Tableau copié")}catch(e){toast("Copie refusée par le téléphone")}
}

/* ---------- tabs ---------- */
function showTab(t){
  $("#v-list").hidden=t!=="list"; $("#v-dash").hidden=t!=="dash";
  $("#t-list").setAttribute("aria-selected",t==="list"); $("#t-dash").setAttribute("aria-selected",t==="dash");
  if(t==="dash")renderDash(); window.scrollTo(0,0);
}
$("#t-list").addEventListener("click",()=>showTab("list"));
$("#t-dash").addEventListener("click",()=>showTab("dash"));
function renderAll(){renderList(); if(!$("#v-dash").hidden)renderDash()}

function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function decrypt(code){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:ENC.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.i)},key,b64(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function start(list){
  SURG=list; BYID=Object.fromEntries(SURG.map(s=>[s.id,s]));
  $("#lock").hidden=true; renderList(); setSync();
}
async function tryUnlock(){
  const code=$("#code").value.trim(); const err=$("#lockerr"); err.hidden=true;
  if(!code)return; $("#unlock").disabled=true; $("#unlock").textContent="Vérification…";
  try{const list=await decrypt(code); lsSet(LS_S,list); start(list);}
  catch(e){err.textContent="Code incorrect. Vérifie les tirets et les minuscules.";err.hidden=false;}
  $("#unlock").disabled=false; $("#unlock").textContent="Déverrouiller";
}
$("#unlock").addEventListener("click",tryUnlock);
$("#code").addEventListener("keydown",e=>{if(e.key==="Enter")tryUnlock()});
const cached=lsGet(LS_S,null);
if(cached&&cached.length) start(cached); else { $("#lock").hidden=false; setSync(); }
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(()=>{offlineReady=true;setSync()}).catch(()=>{});
}
